name: Deploy staging

# Runs after CI passes on main. Builds ARM64 images (Fargate runs ARM), runs migrations as a
# one-off ECS task inside the VPC, then rolls both services onto the new image.
#
# No AWS access keys are stored in GitHub: the role is assumed through OIDC, and its trust
# policy only admits this repository's main branch. The role ARN is not a secret. To deploy to a
# different AWS account, set the repository VARIABLE AWS_DEPLOY_ROLE_ARN to that account's
# `github_deploy_role_arn` Terraform output; otherwise the staging role below is used.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  CLUSTER: passit-staging
  API_REPO: passit-staging-api
  WEB_REPO: passit-staging-web
  RELEASE_REPO: passit-staging-release
  RELEASE_FUNCTION: passit-staging-release
  THUMBNAIL_REPO: passit-staging-thumbnailer
  THUMBNAIL_FUNCTION: passit-staging-thumbnailer

jobs:
  deploy:
    name: Build, migrate, deploy
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image tag
        run: echo "TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::034313912472:role/passit-staging-github-deploy' }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # Tags are immutable, so re-running a deploy for the same commit reuses the image.
          push() {
            repo="$1"; context="$2"; shift 2
            if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
              echo "$repo:$TAG already exists, skipping build"
            else
              docker build -t "$REGISTRY/$repo:$TAG" "$@" "$context"
              docker push "$REGISTRY/$repo:$TAG"
            fi
          }
          push "$API_REPO" api
          push "$WEB_REPO" web --build-arg NEXT_PUBLIC_API_URL=/v1
          # The fee-release Lambda runs the same app code, so it ships with every deploy.
          # --provenance=false: Lambda cannot read the multi-platform manifest buildx adds.
          push "$RELEASE_REPO" api -f api/Dockerfile.lambda --provenance=false
          # The photo thumbnailer. Skipped where its registry does not exist yet. Any other error
          # (a permission problem, say) must fail the deploy, not quietly skip the thumbnailer.
          if check=$(aws ecr describe-images --repository-name "$THUMBNAIL_REPO" --max-items 1 2>&1); then
            push "$THUMBNAIL_REPO" infra/lambdas/thumbnailer --provenance=false
            # Tell the update step an image exists for this commit.
            echo "THUMBNAIL_IMAGE_PUSHED=true" >> "$GITHUB_ENV"
          elif grep -q RepositoryNotFoundException <<<"$check"; then
            echo "No $THUMBNAIL_REPO registry in this environment, skipping the thumbnailer"
          else
            echo "$check" >&2
            exit 1
          fi

      - name: Register task definitions with the new image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          register() {
            family="$1"; repo="$2"
            aws ecs describe-task-definition --task-definition "$family" --query taskDefinition \
              | jq --arg image "$REGISTRY/$repo:$TAG" '
                  .containerDefinitions[0].image = $image
                  | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities,
                        .registeredAt, .registeredBy)' > "/tmp/$family.json"
            aws ecs register-task-definition --cli-input-json "file:///tmp/$family.json" \
              --query taskDefinition.taskDefinitionArn --output text
          }
          {
            echo "API_TD=$(register passit-staging-api "$API_REPO")"
            echo "MIGRATE_TD=$(register passit-staging-migrate "$API_REPO")"
            echo "WEB_TD=$(register passit-staging-web "$WEB_REPO")"
          } >> "$GITHUB_ENV"

      - name: Run migrations
        run: |
          # Reuse the network settings of the running API service.
          network=$(aws ecs describe-services --cluster "$CLUSTER" --services api \
            --query 'services[0].networkConfiguration' --output json)
          task=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$MIGRATE_TD" \
            --launch-type FARGATE --network-configuration "$network" \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task"
          code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$code" != "0" ]; then
            echo "::error::Migration task exited with $code"
            stream="migrate/migrate/${task##*/}"
            aws logs get-log-events --log-group-name "/ecs/passit-staging-api" \
              --log-stream-name "$stream" --query 'events[].message' --output text | tail -40
            exit 1
          fi

      - name: Deploy services
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service api --task-definition "$API_TD" >/dev/null
          aws ecs update-service --cluster "$CLUSTER" --service web --task-definition "$WEB_TD" >/dev/null
          # The deployment circuit breaker rolls back automatically if new tasks never go healthy.
          aws ecs wait services-stable --cluster "$CLUSTER" --services api web

      - name: Update the fee-release Lambda
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          aws lambda update-function-code --function-name "$RELEASE_FUNCTION" \
            --image-uri "$REGISTRY/$RELEASE_REPO:$TAG" --query LastUpdateStatus --output text
          aws lambda wait function-updated --function-name "$RELEASE_FUNCTION"

      - name: Update the thumbnailer Lambda
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          # Needs both an image pushed by this run and the function itself, which exists once
          # Terraform has been given a thumbnailer image tag. Either can be missing while an
          # environment is being set up, and neither should fail a deploy.
          if [ "${THUMBNAIL_IMAGE_PUSHED:-}" = "true" ] \
              && aws lambda get-function --function-name "$THUMBNAIL_FUNCTION" >/dev/null 2>&1; then
            aws lambda update-function-code --function-name "$THUMBNAIL_FUNCTION" \
              --image-uri "$REGISTRY/$THUMBNAIL_REPO:$TAG" --query LastUpdateStatus --output text
            aws lambda wait function-updated --function-name "$THUMBNAIL_FUNCTION"
          else
            echo "No thumbnailer image or function in this environment, skipping"
          fi

      - name: Smoke test
        run: |
          dns=$(aws elbv2 describe-load-balancers --names passit-staging \
            --query 'LoadBalancers[0].DNSName' --output text)
          curl --fail --silent --show-error --max-time 15 "http://$dns/health"
