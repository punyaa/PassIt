name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: FastAPI contract and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install API dependencies
        run: uv sync --project api --dev --locked
      - name: Lint API
        run: uv run --directory api ruff check .
      - name: Test API
        run: uv run --directory api pytest
      - name: Verify committed OpenAPI contract
        run: |
          uv run --directory api python -m scripts.export_openapi
          git diff --exit-code -- api/openapi.json

  web:
    name: Next.js contract and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run generate:api --prefix web
      - run: npm run check --prefix web
      - run: npm run build --prefix web
      - name: Verify generated API types
        run: git diff --exit-code -- web/lib/api-types.ts

  platform:
    name: Platform configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
