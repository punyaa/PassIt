name: Feature request
description: Propose a scoped product or engineering improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who has the problem, and what are they trying to achieve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the outcome without prescribing implementation unless necessary.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Given... when... then..."
    validations:
      required: true
  - type: dropdown
    id: stream
    attributes:
      label: Primary stream
      options:
        - Frontend
        - Accounts
        - Listings
        - Booking
        - Transactions
        - Platform / infrastructure
        - Cross-stream
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Note API, schema, privacy, security, cost, or deployment implications.
