name: Bug report
description: Report reproducible incorrect behaviour
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Please do not include secrets, exact addresses, or personal data.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      placeholder: "1. Start the app...\n2. Open...\n3. See..."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or deployment
      description: Commit SHA, branch, or deployment URL if known.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - Accounts
        - Listings
        - Booking
        - Transactions
        - Platform / infrastructure
        - Documentation
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add logs or screenshots after removing sensitive information.
