[project]
name = "passit-api"
version = "0.1.0"
description = "FastAPI service for the PassIt rental marketplace"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "email-validator>=2,<3",
  "fastapi>=0.120,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pyjwt[crypto]>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "hypothesis>=6.100,<7",
  "pytest>=8,<10",
  "pyyaml>=6,<7",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
